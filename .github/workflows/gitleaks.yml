name: Secret scan

# Blocking secret scan, run explicitly when checking a change for new leaks.
# Enforces CREDENTIALS.md: secrets live in the env, never in the tree.
#
# A one-time full-history audit + purge is a separate, owner-driven pre-release step (roadmap P0/P5 and
# .agents/backlog.md): the known historical `.env` leak must be rotated +
# filter-repo'd out, which a CI gate cannot do. Allowlist tuning (e.g. the
# Android debug keystore) lives in .gitleaks.toml.

# Run from Actions > Run workflow only when requested or needed for a specific change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
