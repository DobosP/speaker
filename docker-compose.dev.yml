# Go-only development overlay, dormant under rollback-web.
# Build/restart to compile current Go source; no Python HTTP reloader is used.
# Example after reading docs/go_serving_boundary.md:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#   --profile rollback-web build token-server
#
# All mounted inputs are read-only. Go's binary/module/build caches use /tmp
# tmpfs; the built binary uses one explicit executable /run/speaker tmpfs.
# Base hardening stays on. Auth has no well-known credential fallback.
# The retained rollback-audio services receive no development overrides.
services:
  token-server:
    build:
      target: dev
    image: speaker-web-dev:latest
    tmpfs:
      - /run/speaker:rw,exec,nosuid,nodev,size=32m,mode=1777
    volumes:
      - ./remote/serving:/src:ro
      - ./web:/app/web:ro
      - ./config.json:/app/config.json:ro
    entrypoint: ["sh", "-ec"]
    command:
      - go build -mod=readonly -trimpath -o /run/speaker/speaker-web ./cmd/speaker-web && exec /run/speaker/speaker-web --config /app/config.json --web-dir /app/web --port 8080
