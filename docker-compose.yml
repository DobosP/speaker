# Optional rollback facade, dormant without an explicit profile (ADR-0096/0097).
# docker compose config is safe without credentials; each runtime fails closed
# when its required auth or transport controls are absent.
#
# Synthetic/local web only: --profile rollback-web. This image has no Python,
# models or provider credentials. /chat returns 503 and /token stays disabled
# because --chat-python and --rollback-voice are absent.
#
# rollback-audio retains the existing Python worker/model image and LiveKit
# composition for rollback review. A profile does not satisfy the machine-local
# trusted-LAN grant or outstanding owner live A/B gates (ADR-0164). No remote
# listeners or real audio are activated by the Go migration itself.
# See docs/go_serving_boundary.md before any optional invocation.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: speaker-remote:latest
  network_mode: host
  user: "10001:10001"
  environment:
    LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    OLLAMA_HOST: ${OLLAMA_HOST:-}
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
    HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ALLOW_PRC: ${ALLOW_PRC:-}

services:
  livekit:
    profiles: [rollback-audio]
    image: livekit/livekit-server:latest
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    # Loopback-only while the ADR-0164 trusted-LAN live gates remain open.
    command: ["--bind", "127.0.0.1"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # One-shot downloader is part of the retained audio rollback only.
  models:
    <<: *worker
    profiles: [rollback-audio]
    user: "0:0"
    entrypoint: ["python", "/usr/local/bin/download_models.py"]
    # Downloading models has no need for web auth or LLM provider credentials.
    environment:
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - models:/models
    restart: "no"

  worker:
    <<: [*worker, *hardening]
    profiles: [rollback-audio]
    command: ["python", "-m", "remote.worker"]
    volumes:
      - models:/models:ro
    depends_on:
      models:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    restart: "no"

  # Actual Go HTTP/auth/JWT/static boundary; no Python HTTP server/proxy.
  token-server:
    <<: *hardening
    profiles: [rollback-web]
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: runtime
    image: speaker-web:latest
    network_mode: host
    user: "10001:10001"
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      SPEAKER_REMOTE_TOKEN: ${SPEAKER_REMOTE_TOKEN:-}
      SPEAKER_REMOTE_ALLOW_NOAUTH: ${SPEAKER_REMOTE_ALLOW_NOAUTH:-}
      SPEAKER_REMOTE_BIND_ALL: ${SPEAKER_REMOTE_BIND_ALL:-}
    command: ["--config", "/app/config.json", "--web-dir", "/app/web", "--port", "8080"]
    restart: "no"

volumes:
  models:
